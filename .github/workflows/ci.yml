name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `--all-features` would turn on `force-shim` on Linux, so each backend
      # is linted with an explicit feature set instead.
      - name: clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: clippy (mio, ffi)
        run: cargo clippy --locked --all-targets --features mio,ffi -- -D warnings
      - name: clippy (force-shim, mio)
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets --features force-shim,mio -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - name: test (default features)
        run: cargo test --locked
      - name: test (mio, ffi)
        run: cargo test --locked --features mio,ffi

  force-shim:
    name: test force-shim (Linux, ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: force-shim-${{ matrix.rust }}
      - run: cargo test --locked --features force-shim
      - run: cargo test --locked --features force-shim,mio

  c-ffi-unix:
    name: C FFI (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build staticlib
        run: |
          # Make sure rustc runs (and prints the note) even with a warm cache.
          touch src/lib.rs
          cargo rustc --locked --release --features ffi --crate-type staticlib \
            -- --print native-static-libs 2>&1 | tee build.log
          LIBS=$(sed -n 's/.*native-static-libs: //p' build.log | head -n1)
          echo "native-static-libs: $LIBS"
          echo "NATIVE_LIBS=$LIBS" >> "$GITHUB_ENV"
      - name: compile smoke.c
        run: |
          ${{ matrix.cc }} -std=c11 -Wall -Wextra -Werror -Iinclude \
            examples/c/smoke.c target/release/libadaptif_gatotkaca_eventfd.a \
            $NATIVE_LIBS -o smoke
      - name: run smoke
        run: ./smoke

  c-ffi-windows:
    name: C FFI (windows-latest, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: build staticlib
        shell: pwsh
        run: |
          (Get-Item src/lib.rs).LastWriteTime = Get-Date
          $out = cargo rustc --locked --release --features ffi --crate-type staticlib -- --print native-static-libs 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($out -notmatch 'native-static-libs: ([^\r\n]*)') { throw 'native-static-libs note not found' }
          $libs = $Matches[1].Trim()
          Write-Output "native-static-libs: $libs"
          "NATIVE_LIBS=$libs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: compile smoke.c
        shell: pwsh
        run: |
          # rustc's list (typically kernel32 advapi32 ntdll userenv ws2_32
          # dbghelp /defaultlib:msvcrt), plus the libraries the Windows shim
          # is known to need, in case the note changes.
          $libs = (($env:NATIVE_LIBS -split '\s+') + @('ws2_32.lib', 'userenv.lib', 'ntdll.lib', 'bcrypt.lib', 'advapi32.lib', 'kernel32.lib')) |
            Where-Object { $_ } | Select-Object -Unique
          cl /nologo /W3 /WX /MD /Iinclude examples\c\smoke.c /Fe:smoke.exe /link target\release\adaptif_gatotkaca_eventfd.lib @libs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: run smoke
        shell: pwsh
        run: |
          .\smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  cross-check:
    name: check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: aarch64-linux-android }
          - { os: ubuntu-latest, target: x86_64-unknown-freebsd }
          - { os: macos-latest, target: aarch64-apple-ios }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo check --locked --target ${{ matrix.target }}
      - run: cargo check --locked --target ${{ matrix.target }} --features mio,ffi
      - name: check force-shim (Android)
        if: matrix.target == 'aarch64-linux-android'
        run: cargo check --locked --target ${{ matrix.target }} --features force-shim,mio

  miri:
    name: miri (counter, allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      # The counter is pure Rust (Mutex + Condvar), so Miri can check it.
      # The OS backends make syscalls Miri can't run, so they're skipped.
      - run: "cargo miri test --locked --lib counter::"

  docs:
    name: docs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --features mio,ffi

  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked --list
      - run: cargo publish --locked --dry-run
