[package]
name = "adaptif-gatotkaca-eventfd"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["PT Adaptif Sinergi Dinamis"]
description = "Cross-platform eventfd with Linux semantics everywhere: the kernel eventfd on Linux and the BSDs, a faithful shim on macOS and Windows, shareable across processes, with a C ABI matching <sys/eventfd.h>."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://adaptif.co.id/"
repository = "https://github.com/csatrio/adaptif-gatotkaca-eventfd"
documentation = "https://docs.rs/adaptif-gatotkaca-eventfd"
keywords = ["eventfd", "ipc", "notification", "mio", "cross-platform"]
categories = ["os", "asynchronous", "concurrency", "api-bindings"]
include = ["build.rs", "src/**", "include/**", "examples/**", "tests/**", "Cargo.toml", "README.md", "AGENTS.md", "CHANGELOG.md", "LICENSE-*"]

[lib]
name = "adaptif_gatotkaca_eventfd"

[features]
default = []
# Export the C ABI (gk_eventfd*, see include/adaptif_gatotkaca_eventfd.h).
ffi = []
# Implement mio::event::Source for GkEventFd.
mio = ["dep:mio"]
# Use the portable unix shim even on Linux (for differential testing only).
force-shim = []

[dependencies]
# Backoff for the shims' cross-process spinlock (src/sys/shm.rs).
crossbeam-utils = "0.8"
mio = { version = "1", optional = true, features = ["os-ext", "net"] }
nohash-hasher = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
proptest = "1"

[package.metadata.docs.rs]
# Not all-features: `force-shim` would document the Linux shim instead of the
# kernel eventfd.
features = ["mio", "ffi"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
